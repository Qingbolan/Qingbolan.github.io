        <h1>Silan Hu</h1>
        <p>Silan Hu is an NUS Computer Science PhD student advised by Prof. Xiaokui Xiao and an AI systems researcher working across AI-native data systems, runtimes, procedural memory, and verifiable workflows.</p>
        <p>Evidence on this site includes GEM-Bench, Silan Hu's first-author ACM SIGKDD 2026 (CCF-A) paper; VDSAgents, a journal paper on PCS-guided multi-agent data-science automation; FOKE, his first-author work on personalized explainable education; infrastructure work for Open-Sora 2.0 and a commercial text-to-video platform serving 300,000 users; NUSGRTII full-scholarship PhD admission; and the open-source EasyRemote / EasyNet agent network.</p>
